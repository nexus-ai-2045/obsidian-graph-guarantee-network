name: 不具合報告
description: graph guarantee network の不具合や検証失敗を報告する
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        private vault contents、secret、個人情報、local absolute path は貼らないでください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたかを短く書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 検証結果
      description: `tools\verify-obsidian-graph-network.ps1` や safety scan の結果を、secret を除いて貼ってください。
    validations:
      required: false
